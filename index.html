<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>earlliee</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Login Screen Styling */
    .login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a0033 0%, #330066 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
    }

    .login-container {
      background: rgba(0, 0, 0, 0.8);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(255, 20, 147, 0.3);
      border: 2px solid #ff1493;
      text-align: center;
      min-width: 300px;
    }

    .login-container h1 {
      color: #ff1493;
      margin-bottom: 10px;
      font-size: 2.5em;
      text-shadow: 0 0 20px rgba(255, 20, 147, 0.8);
    }

    .login-container p {
      color: #ffb6c1;
      margin-bottom: 30px;
      font-size: 1.1em;
    }

    .login-input-group {
      margin-bottom: 20px;
    }

    .login-input-group label {
      display: block;
      color: #ffb6c1;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .login-input-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ff1493;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 8px;
      font-size: 1em;
      text-align: center;
      letter-spacing: 3px;
    }

    .login-input-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .login-input-group input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ff1493, #ff69b4);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 20, 147, 0.6);
    }

    .login-error {
      color: #ff6b6b;
      margin-top: 15px;
      display: none;
      font-weight: bold;
    }

    .login-animation {
      display: none;
      width: 180px;
      max-width: 100%;
      margin: 18px auto 0;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 20, 147, 0.7);
    }

    .login-animation.show {
      display: block;
      -webkit-animation: revealAnimation 0.6s ease-out forwards,
                         loginAnimationLoop 1.2s ease-in-out 0.6s infinite alternate;
      animation: revealAnimation 0.6s ease-out forwards,
                 loginAnimationLoop 1.2s ease-in-out 0.6s infinite alternate;
    }

    @keyframes revealAnimation {
      from {
        opacity: 0;
        transform: scale(0.5) rotate(-8deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes loginAnimationLoop {
      from {
        transform: scale(1) rotate(-3deg);
      }
      to {
        transform: scale(1.08) rotate(3deg);
      }
    }

    .hidden {
      display: none !important;
    }

    /* Birthday Greetings Animation */
    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-100px) rotateY(90deg);
      }
      to {
        opacity: 1;
        transform: translateX(0) rotateY(0deg);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100px) rotateY(-90deg);
      }
      to {
        opacity: 1;
        transform: translateX(0) rotateY(0deg);
      }
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    @keyframes fadeInOut {
      0%, 100% {
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
    }

    /* Fireworks Animation */
    @keyframes fireworks {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    .fireworks-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 300;
      pointer-events: none;
    }

    .firework {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      animation: fireworks 1.5s ease-out forwards;
    }

    .firework.gold { background: #FFD700; box-shadow: 0 0 10px #FFD700; }
    .firework.pink { background: #ff1493; box-shadow: 0 0 10px #ff1493; }
    .firework.cyan { background: #00ffff; box-shadow: 0 0 10px #00ffff; }
    .firework.lime { background: #00ff00; box-shadow: 0 0 10px #00ff00; }

    .birthday-left, .birthday-right {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.6em;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255, 20, 147, 0.8),
                   0 0 40px rgba(255, 105, 180, 0.6);
      z-index: 500;
      color: #ff1493;
      pointer-events: none;
      opacity: 0;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .birthday-left {
      left: 15px;
      animation: slideInLeft 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: 0.3s;
    }

    .birthday-right {
      right: 15px;
      animation: slideInRight 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: 0.5s;
    }

    .birthday-left.show,
    .birthday-right.show {
      animation: slideInLeft 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, pulse 2s ease-in-out 1.5s infinite;
    }

    .birthday-right.show {
      animation: slideInRight 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, pulse 2s ease-in-out 1.5s infinite;
    }

    /* Hope Messages */
    .hope-message {
      position: fixed;
      font-size: 1.1em;
      font-weight: bold;
      text-shadow: 0 0 15px rgba(255, 20, 147, 0.7),
                   0 0 30px rgba(255, 105, 180, 0.5);
      z-index: 400;
      color: #ff69b4;
      pointer-events: none;
      opacity: 0;
      white-space: nowrap;
      letter-spacing: 1px;
      animation: slideInDown 1s ease-out forwards, fadeInOut 2s ease-in-out 1s infinite;
    }

    .hope-message.show {
      opacity: 1;
    }

    .hope-1 {
      top: 15%;
      left: 5%;
      animation-delay: 0.8s;
    }

    .hope-2 {
      top: 35%;
      right: 5%;
      animation-delay: 1.2s;
    }

    .hope-3 {
      bottom: 15%;
      right: 5%;
      animation-delay: 1.6s;
    }

    .hope-4 {
      top: 70%;
      left: 5%;
      animation-delay: 2s;
    }

  </style>

</head>
<body>

  <!-- Fireworks Container -->
  <div class="fireworks-container" id="fireworksContainer"></div>

  <!-- Birthday Greetings -->
  <div class="birthday-left" id="birthdayLeft">Selamat Ulang Tahun</div>
  <div class="birthday-right" id="birthdayRight">Happy Birthday</div>

  <!-- Hope Messages -->
  <div class="hope-message hope-1" id="hope1">Bahagia Selalu</div>
  <div class="hope-message hope-2" id="hope2">Panjang Umur</div>
  <div class="hope-message hope-3" id="hope3">Impian Terwujud</div>
  <div class="hope-message hope-4" id="hope4">Penuh Berkah</div>

  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-container">
      <h1>💖</h1>
      <h2 style="color: #ff1493; margin-bottom: 20px;">Untuk Kamu</h2>
      <p>Masukkan password untuk melanjutkan</p>
      <div class="login-input-group">
        <input type="password" id="passwordInput" placeholder="Masukkan kata sandi" />
      </div>
      <button class="login-btn" id="loginBtn">MASUK</button>
      <div class="login-error" id="loginError"></div>
      <img class="login-animation" id="loginAnimation" src="./ANIMASI.gif" alt="Animasi kejutan" />
    </div>
  </div>

  <div class="bubbles">
    <!-- Simplified hearts to avoid broken/truncated SVGs -->
    <div class="bubble">❤️</div>
    <div class="bubble">💖</div>
    <div class="bubble">💜</div>
    <div class="bubble">💙</div>
    <div class="bubble">💛</div>
    <div class="bubble">💚</div>
    <div class="bubble">🧡</div>
    <div class="bubble">💫</div>
    <div class="bubble">✨</div>
    <div class="bubble">🌟</div>
  </div>

<script>
  // Removed incomplete data URIs that caused syntax errors in the original file.
  // If you need svg_terrain/svg_heart as data URIs, re-add them as full valid strings here.
</script>

  <audio id="bgm" loop style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0,0,0,0.7); padding:6px; border-radius:6px;">
    <source src="./shape-of-my-heart-reff.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <audio id="kuntilanakSound" preload="auto">
    <source src="./KUNTILANAK.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Audio player controller
    // Defer DOM-sensitive work to load event to avoid null references
    window.addEventListener('load', () => {
      const audioPlayer = document.getElementById('bgm');
      if (audioPlayer) {
        // Ensure styling is applied (keep simple)
        setTimeout(() => {
          audioPlayer.style.cssText = 'position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0,0,0,0.7); padding:6px; border-radius:6px;';
        }, 100);
        // Add controls dynamically
        audioPlayer.controls = true;
      }

      // Don't auto-play on load - wait for password verification
    });
  </script>

  <script>
    // Fireworks Function
    function createFireworks() {
      const colors = ['gold', 'pink', 'cyan', 'lime'];
      const container = document.getElementById('fireworksContainer');
      if (!container) return;

      // Create fireworks in multiple bursts
      for (let burst = 0; burst < 5; burst++) {
        setTimeout(() => {
          for (let i = 0; i < 40; i++) {
            const firework = document.createElement('div');
            firework.className = 'firework ' + colors[Math.floor(Math.random() * colors.length)];

            // Random starting position
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight * 0.5;

            firework.style.left = x + 'px';
            firework.style.top = y + 'px';

            // Random direction
            const angle = (Math.random() * Math.PI * 2);
            const velocity = 5 + Math.random() * 10;
            const tx = Math.cos(angle) * velocity * 30;
            const ty = Math.sin(angle) * velocity * 30;

            firework.style.setProperty('--tx', tx + 'px');
            firework.style.setProperty('--ty', ty + 'px');

            container.appendChild(firework);

            // Remove after animation
            setTimeout(() => firework.remove(), 1500);
          }
        }, burst * 400);
      }
    }

    // Login Handler
    const CORRECT_PASSWORD = 'KUNTILANAK';
    let wrongAttempts = 0;

    // Wrap DOM queries in a load handler to be safe
    window.addEventListener('load', () => {
      const loginScreen = document.getElementById('loginScreen');
      const passwordInput = document.getElementById('passwordInput');
      const loginError = document.getElementById('loginError');
      const kuntilanakSound = document.getElementById('kuntilanakSound');
      const loginAnimation = document.getElementById('loginAnimation');
      const loginBtn = document.getElementById('loginBtn');

      if (kuntilanakSound) kuntilanakSound.loop = true;

      function checkPassword() {
        const enteredPassword = (passwordInput?.value || '').trim().toUpperCase();

        if (enteredPassword === CORRECT_PASSWORD) {
          // Password correct - hide login screen
          if (kuntilanakSound && !kuntilanakSound.paused) {
            kuntilanakSound.pause();
            kuntilanakSound.currentTime = 0;
          }
          if (loginScreen) loginScreen.classList.add('hidden');

          // Enable the main content - guard elements
          const bubbles = document.querySelector('.bubbles');
          if (bubbles) bubbles.style.opacity = '1';
          const canvas = document.querySelector('canvas');
          if (canvas) canvas.style.opacity = '1';

          // Show birthday greetings
          const birthdayLeft = document.getElementById('birthdayLeft');
          const birthdayRight = document.getElementById('birthdayRight');
          birthdayLeft?.classList.add('show');
          birthdayRight?.classList.add('show');

          // Show hope messages
          const hope1 = document.getElementById('hope1');
          const hope2 = document.getElementById('hope2');
          const hope3 = document.getElementById('hope3');
          const hope4 = document.getElementById('hope4');

          setTimeout(() => hope1?.classList.add('show'), 800);
          setTimeout(() => hope2?.classList.add('show'), 1200);
          setTimeout(() => hope3?.classList.add('show'), 1600);
          setTimeout(() => hope4?.classList.add('show'), 2000);

          // Create fireworks
          setTimeout(() => createFireworks(), 500);

          // Auto play music AFTER password is verified
          const audioPlayer = document.getElementById('bgm');
          setTimeout(() => {
            audioPlayer?.play().catch(err => console.log('Autoplay error:', err));
          }, 800);
        } else {
          wrongAttempts += 1;
          const errorMessages = [
            'SANDINYA SALAH SAYANG',
            'SANDINYA SALAH TUAN PUTRI',
            'EH SANDINYA ITU "KUNTILANAK"'
          ];
          if (loginError) {
            loginError.textContent = errorMessages[Math.min(wrongAttempts, errorMessages.length) - 1];
            loginError.style.display = 'block';
          }
          if (wrongAttempts >= 3) {
            loginAnimation?.classList.add('show');
            try {
              kuntilanakSound?.play();
            } catch (err) {
              console.log('Sound error:', err);
            }
          }
          if (passwordInput) {
            passwordInput.value = '';
            passwordInput.focus();
          }
          // Hide error after 3 seconds
          setTimeout(() => {
            if (loginError) loginError.style.display = 'none';
          }, 3000);
        }
      }

      // Button click
      loginBtn?.addEventListener('click', checkPassword);

      // Allow Enter key to submit
      passwordInput?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          checkPassword();
        }
      });

      // Focus on password input on load
      passwordInput?.focus();
    });
  </script>

  <script src='https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/pathseg@1.2.1/pathseg.min.js'></script>

</body>
</html>
